# Server-Endpunkt (ohne trailing slash)
server: https://ntfy.danzl.it

# Auth.  Entweder Basic (username + password) ODER Bearer Token — Token
# gewinnt falls beides gesetzt ist.
# Env-Overrides: NTFY_USERNAME, NTFY_PASSWORD, NTFY_TOKEN (Secrets nicht ins YAML).
auth:
  username: pomodoro-bot
  # password: hier-oder-via-NTFY_PASSWORD-env
  # token: tk_xxxxxxxx           # oder via NTFY_TOKEN-env

# Topic, an dem auf ON/OFF gehört wird.
control_topic: pomodoro-control

# Was nach dem Publish mit der Notification passiert.
#   mode:
#     clear          PUT /<topic>/<seq>/clear nach delay_seconds
#                    (Drawer dismissed, History bleibt sichtbar)
#     delete         DELETE /<topic>/<seq> nach delay_seconds
#                    (Drawer raus + aus Client-DB raus)
#     clear_on_next  Vorherige Notification clearen sobald die nächste publishen geht
#                    (delay_seconds ignoriert; gilt global über alle Output-Topics)
#     delete_on_next analog clear_on_next aber mit DELETE
#     none           Nichts tun
#   delay_seconds: nur relevant bei mode=clear|delete.  0 deaktiviert removal komplett.
removal:
  mode: clear_on_next
  delay_seconds: 0

# Cron-Jobs.  Standard 5-Feld Cron-Syntax: minute hour day-of-month month day-of-week
# Komma-Listen (0,30), Ranges (8-17, 1-5) und Wildcards (*) gehen.
jobs:
  - cron: "0,30 8-17 * * 1-5"
    topic: pomodoro-start
    message: START

  - cron: "25,55 8-17 * * 1-5"
    topic: pomodoro-pause
    message: PAUSE
